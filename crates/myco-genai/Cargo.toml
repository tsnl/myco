[package]
name = "myco-genai"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "One-attempt streaming inference for OpenAI Responses and Anthropic Messages"

[dependencies]
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1.0.150"
thiserror = "2.0.18"

[dev-dependencies]
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "net", "io-util", "sync", "time"] }
