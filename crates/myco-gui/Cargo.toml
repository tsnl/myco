[package]
name = "myco-gui"
description = "myco: minimal Yew web client"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
myco-api = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
yew = { version = "0.21", features = ["csr"] }
yew-router = "0.18"
gloo-net = { version = "0.6", features = ["eventsource"] }
gloo-timers = { version = "0.3", features = ["futures"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Document", "Element", "HtmlInputElement", "HtmlTextAreaElement", "KeyboardEvent", "Notification", "NotificationOptions", "NotificationPermission", "Storage", "Window"] }
futures = { workspace = true }
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
