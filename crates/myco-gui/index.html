<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>myco</title>
    <style>
      :root {
        color-scheme: dark;
        /* Terminal palette, darkest to lightest. */
        --bg: #101010;
        --bg-raised: #161616;
        --line: #333;
        --line-soft: #2c2c2c;
        --fg: #d8d8d8;
        --fg-dim: #777;
        --user: #6fc26f;
        --tool: #b09be5;
        --err: #e07a7a;
        --link: #7ab7ff;
        /* Only the transcript scrolls: no page-level bounce or overscroll. */
        height: 100svh;
        overflow: hidden;
        overscroll-behavior: none;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        background: var(--bg); color: var(--fg);
        font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        font-size: 14px; line-height: 1.45;
        overflow: hidden;
      }
      a { color: var(--link); text-decoration: none; }
      a:hover { text-decoration: underline; }
      pre { margin: 0; white-space: pre-wrap; word-break: break-word; font: inherit; }
      h1, h2, h3, h4, h5, h6 { font-size: inherit; }
      h1 { letter-spacing: 0.3em; margin: 0 0 0.5rem; }
      button {
        background: #101010; color: var(--fg); font: inherit;
        border: 1px solid #444; padding: 0.15rem 0.7rem; cursor: pointer;
      }
      button:hover { border-color: #888; }
      /* Inline affordance that reads as text, not a control (sign out). */
      button.linkish {
        background: none; border: none; padding: 0; color: var(--link);
        text-decoration: underline; cursor: pointer;
      }
      button.linkish:hover { color: var(--fg); }
      .login { max-width: 36ch; }
      .login-row { margin: 0.35rem 0; }
      .login input { width: 100%; }
      button:disabled { opacity: 0.5; cursor: default; }
      input[type="password"], input[type="text"] {
        background: #0d0d0d; color: var(--fg); font: inherit;
        border: 1px solid #444; border-radius: 6px;
        padding: 0.35rem 0.6rem; min-width: 28ch;
      }
      input[type="password"]:focus, input[type="text"]:focus {
        outline: none; border-color: #777; box-shadow: 0 0 0 3px rgba(255,255,255,0.06);
      }

      /* Terminal layout: a scrolling transcript with the prompt pinned below. */
      .app { display: flex; flex-direction: column; height: 100dvh; min-height: 0; }
      .topbar {
        flex: none; padding: 0.5rem 1rem; border-bottom: 1px solid var(--line);
      }
      .pane {
        /* flex child: `min-height: 0` is what makes this scroll instead of
           growing and pushing the composer off-screen. */
        flex: 1 1 auto; min-height: 0;
        overflow-y: auto; overflow-x: hidden;
        padding: 0.5rem 1rem 1rem;
      }
      /* Every band shares one centered column, so the page reads as a
         single centered transcript rather than a left-aligned wall. */
      .column { width: 100%; max-width: 84ch; margin: 0 auto; }
      /* Input bar, after honk: the field fills the whole column width and
         lifts off the transcript with a shadow. Everything else — the room
         hint, the cancel affordance — lives on a slim status line *below*
         the field, so nothing competes with it for width. Enter submits, so
         the send button stays hidden. */
      .composer {
        flex: none; border-top: 1px solid var(--line);
        padding: 0.5rem 1rem;
        box-shadow: 0 -4px 16px rgba(0, 0, 0, 0.45);
      }
      .composer .column {
        display: flex; flex-direction: column; gap: 0.3rem;
      }
      .composer textarea {
        width: 100%;
        background: transparent; color: var(--fg); font: inherit;
        border: 1px solid #3a3a3a; border-radius: 8px;
        padding: 0.5rem 0.6rem; resize: none; outline: none;
        /* Grow with the draft where supported (Chromium); the rows
           attribute is the graceful floor elsewhere. */
        field-sizing: content;
        min-height: 2.4em; max-height: 30vh;
      }
      .composer textarea::placeholder { color: var(--fg-dim); }
      .composer textarea:focus {
        border-color: var(--fg-dim);
        box-shadow: 0 0 2px var(--fg);
      }
      /* The line under the field: hint text left, controls right. Kept at a
         fixed slim height so the composer does not jump when the hint or the
         cancel button appears. */
      .actions {
        display: flex; align-items: center; gap: 0.4rem;
        min-height: 1.5em; font-size: 0.85em;
      }
      .actions .send { display: none; }
      .actions .spacer { flex: 1 1 auto; }
      .hint { margin-left: 0; }

      /* The work rail: running tools and live shells, beside the transcript.
         Collapsible; when open it owns a fixed width and its own scroll. */
      .pane-row { flex: 1 1 auto; min-height: 0; display: flex; }
      .pane-row .pane { flex: 1 1 auto; min-width: 0; }
      .rail {
        flex: none; width: 24rem; min-height: 0; overflow-y: auto;
        border-left: 1px solid var(--line);
        padding: 0.5rem 0.75rem;
      }
      .rail h2 {
        color: var(--fg-dim); font-weight: bold; letter-spacing: 0.08em;
        margin: 0.6rem 0 0.3rem; font-size: 0.85em; text-transform: uppercase;
      }
      .rail h2:first-child { margin-top: 0; }
      .rail .empty { color: var(--fg-dim); font-size: 0.9em; }
      /* One running tool call, mirroring its transcript card in miniature.
         Clicking jumps to the kickoff card. */
      .rail-tool {
        display: flex; align-items: baseline; gap: 0.4rem;
        border: 1px solid var(--line); border-radius: 6px;
        background: var(--bg-raised);
        padding: 0.25rem 0.5rem; margin: 0.25rem 0; cursor: pointer;
        overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
      }
      .rail-tool:hover { border-color: #666; }

      /* A shell terminal. The border is the lock indicator: green while the
         user holds the keyboard, the tool colour while the agent does. */
      .term {
        border: 1px solid var(--tool); border-radius: 6px;
        margin: 0.35rem 0; overflow: hidden;
        background: #0b0b0b;
      }
      .term-user { border-color: var(--user); box-shadow: 0 0 4px rgba(111, 194, 111, 0.35); }
      .term-head {
        display: flex; align-items: baseline; gap: 0.4rem;
        padding: 0.25rem 0.5rem; cursor: pointer;
        border-bottom: 1px solid var(--line-soft);
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }
      .term-head .lock-badge {
        margin-left: auto; font-size: 0.8em; color: var(--fg-dim);
      }
      .term-user .term-head .lock-badge { color: var(--user); }
      .term-body {
        max-height: 40vh; overflow-y: auto;
        padding: 0.3rem 0.5rem; font-size: 0.9em;
        /* Terminal text is preformatted but must never widen the rail. */
        white-space: pre-wrap; word-break: break-word;
        user-select: text;
      }
      .term-input-row {
        display: flex; border-top: 1px solid var(--line-soft);
      }
      .term-input-row input {
        flex: 1 1 auto; min-width: 0;
        background: transparent; color: var(--fg); font: inherit;
        border: 0; outline: none; padding: 0.3rem 0.5rem;
      }
      .term-hint {
        padding: 0.25rem 0.5rem; color: var(--fg-dim); font-size: 0.8em;
        border-top: 1px solid var(--line-soft);
      }

      /* Session browser */
      .browser { padding: 1rem; }
      .browser ul { list-style: none; padding: 0; margin: 0.5rem 0; }
      .browser li { margin: 0.1rem 0; }

      /* Transcript roles — the terminal's palette */
      .rule { border: 0; border-top: 1px solid var(--line); margin: 0.8rem 0 0.3rem; }

      /* Turns. The transcript is a sequence of these, one per stretch of
         speech from one sender. There is no separator element between them:
         the grouping is the structure, and the space plus a thin accent in
         the sender's colour is what a reader parses. */
      .turn {
        margin: 0.9rem 0;
        padding-left: 0.7rem;
        border-left: 2px solid var(--line-soft);
      }
      .turn:first-child { margin-top: 0.2rem; }
      .turn-user { border-left-color: var(--user); }
      .turn-assistant { border-left-color: var(--line); }
      .turn-tool { border-left-color: var(--tool); }
      /* The heading sits tight against the turn it opens. */
      .turn > .role { margin-bottom: 0.25rem; }

      .role { font-weight: bold; }
      .role-user { color: var(--user); }
      /* The ASSISTANT header. The body below it stays unbold (.role-assistant),
         so the name reads as a section rule rather than shouted prose. */
      .role-assistant-name { color: var(--fg); }
      .role-assistant { color: #d8d8d8; }
      /* @handles: visible in a wall of text, and unmissable when they are you. */
      .mention { color: var(--tool); }
      .mention-me {
        color: var(--bg); background: var(--user);
        border-radius: 3px; padding: 0 0.2em; font-weight: bold;
      }
      .hint { margin-left: 0.6rem; font-size: 0.85em; }
      .role-thinking { color: var(--fg-dim); font-style: italic; }
      .role-tool { color: var(--tool); }

      /* Tool calls: each its own block, collapsed to a summary by default.
         The header is the toggle; the whole card is one visual unit so a long
         transcript reads as prose punctuated by calls, not as a wall. */
      .tool-card {
        border: 1px solid var(--line); border-radius: 6px;
        background: var(--bg-raised);
        margin: 0.5rem 0; overflow: hidden;
      }
      .tool-card-error { border-color: #5a3232; }
      .tool-head {
        display: flex; align-items: baseline; gap: 0.4rem;
        padding: 0.3rem 0.6rem; cursor: pointer;
        border-bottom: 1px solid var(--line-soft);
      }
      .tool-head:hover { background: #1c1c1c; }
      .tool-caret { color: var(--fg-dim); width: 1ch; }
      .tool-name { color: var(--tool); font-weight: bold; }

      /* Status at a glance: one disc, three states. Colour is the fast signal
         and the disc carries a title so it is not the only one. */
      .tool-disc { width: 1ch; line-height: 1; }
      .tool-disc-ok { color: var(--user); }
      .tool-disc-failed { color: var(--err); }
      .tool-disc-running { color: #fff; animation: tool-pulse 1s steps(1) infinite; }
      @keyframes tool-pulse { 50% { opacity: 0.15; } }
      /* A blinking element is exactly what vestibular and attention-related
         motion sensitivity settings ask us to drop; the colour still reads. */
      @media (prefers-reduced-motion: reduce) {
        .tool-disc-running { animation: none; opacity: 0.6; }
      }
      /* Pushed right, revealed on hover: present when wanted, quiet otherwise. */
      .tool-toggle {
        margin-left: auto; color: var(--fg-dim); font-size: 0.85em;
        opacity: 0; transition: opacity 0.1s;
      }
      .tool-head:hover .tool-toggle { opacity: 1; }
      .tool-result {
        border-top: 1px solid var(--line-soft);
        padding: 0.3rem 0.6rem; max-height: 60vh; overflow: auto;
      }
      /* Code, wherever it appears: fenced blocks, tool arguments, results.
         Wide content scrolls inside its own box so the page never does. */
      pre.code {
        margin: 0; padding: 0.4rem 0.6rem;
        overflow-x: auto; white-space: pre; word-break: normal;
      }
      pre.code.json { background: none; border: 0; }
      .md pre.code { background: #0d0d0d; border: 1px solid var(--line-soft); border-radius: 4px; }
      .err { color: var(--err); }
      .dim { color: var(--fg-dim); }

      /* Rendered markdown, kept flat and terminal-ish */
      .md > *:first-child { margin-top: 0; }
      .md > *:last-child { margin-bottom: 0; }
      .md p, .md ul, .md ol, .md blockquote, .md pre { margin: 0.4rem 0; }
      /* Headings never grow: same size as body, distinguished by weight,
         color, and the markdown marker itself. */
      .md h1, .md h2, .md h3, .md h4, .md h5, .md h6 {
        font-size: inherit; font-weight: bold;
        margin: 0.8rem 0 0.3rem; color: #fff;
      }
      .md h1::before { content: "# "; color: var(--fg-dim); font-weight: normal; }
      .md h2::before { content: "## "; color: var(--fg-dim); font-weight: normal; }
      .md h3::before { content: "### "; color: var(--fg-dim); font-weight: normal; }
      .md h4::before { content: "#### "; color: var(--fg-dim); font-weight: normal; }
      .md h5::before { content: "##### "; color: var(--fg-dim); font-weight: normal; }
      .md h6::before { content: "###### "; color: var(--fg-dim); font-weight: normal; }
      .md code {
        background: #1c1c1c; border: 1px solid var(--line-soft); padding: 0 0.2em;
      }
      .md pre {
        background: var(--bg-raised); border: 1px solid var(--line-soft); padding: 0.5rem;
        overflow-x: auto;
      }
      .md pre code { background: none; border: 0; padding: 0; }
      .md blockquote {
        border-left: 2px solid #444; margin-left: 0; padding-left: 0.8rem;
        color: #aaa;
      }
      .md ul, .md ol { padding-left: 1.4rem; }
      .md table { border-collapse: collapse; }
      .md th, .md td { border: 1px solid #333; padding: 0.1rem 0.5rem; }
      .md a { color: var(--link); }
      .md img { max-width: 100%; }
    </style>
  </head>
  <body></body>
</html>
