[package]
name = "myco-client-web"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
js-sys = { workspace = true }

[dependencies.web-sys]
workspace = true
features = [
    "Event",
    "EventTarget",
    "Location",
    "MessageEvent",
    "NodeList",
    "Node",
    "WebSocket",
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "Headers",
    "HtmlInputElement",
    "KeyboardEvent",
    "Request",
    "RequestInit",
    "Response",
    "Storage",
]
