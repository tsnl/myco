[workspace]
resolver = "3"
members = [
    "crates/runtime",
    "crates/instance",
    "crates/kind-tty",
    "crates/kind-chat",
    "crates/kind-notifier",
    "crates/models",
    "crates/wire",
    "crates/provider",
    "crates/hostd",
    "crates/server",
    "crates/myco",
    "clients/web",
]

[workspace.package]
edition = "2024"
license = "MIT"

[workspace.dependencies]
async-trait = "0.1"
base64 = "0.22"
axum = { version = "0.8", features = ["ws"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
futures = "0.3"
http-body-util = "0.1"
libc = "0.2"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "charset", "http2", "system-proxy", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.26"
toml = "0.8"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["set-header"] }
url = "2"
uuid = { version = "1", features = ["v4", "v5"] }
vt100 = "0.15"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = "0.3"
js-sys = "0.3"
rust-embed = { version = "8", features = ["interpolate-folder-path"] }
mime_guess = "2"
webauthn-rs = "0.5.5"
webauthn-authenticator-rs = { version = "0.5.5", features = ["softtoken"] }
