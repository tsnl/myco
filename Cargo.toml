[workspace]
resolver = "3"

[package]
name = "myco"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/tsnl/myco"
description = "Myco conversation engine"

[dependencies]
async-stream = "0.3.6"
futures-core = "0.3.34"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
uuid = "1.26.1"

[dev-dependencies]
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "net", "io-util", "sync", "time"] }
