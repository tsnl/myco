[package]
name = "myco"
description = "Multi-host coding agent: API server driving concurrent agents across SSH remotes"
version.workspace = true
edition.workspace = true
license.workspace = true
repository = "https://github.com/tsnl/myco"
homepage = "https://github.com/tsnl/myco"
readme = "README.md"
keywords = ["agent", "server", "ssh", "coding"]
categories = ["development-tools"]

[dependencies]
uuid = { workspace = true }
async-trait = { workspace = true }
myco-core = { workspace = true }
myco-prompts = { workspace = true }
myco-models = { workspace = true }
myco-config = { workspace = true }
myco-session = { workspace = true }
myco-machines = { workspace = true }
myco-agent = { workspace = true }
myco-api = { workspace = true }
myco-auth = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
rocket = { workspace = true }
clap = { workspace = true }
dotenvy = { workspace = true }
schemars = { workspace = true }
reqwest = { workspace = true }
libc = "0.2.189"

[dev-dependencies]
myco-test-support = { workspace = true }
tempfile = "3"

[workspace]
resolver = "3"
members = [
    "crates/myco-core",
    "crates/myco-prompts",
    "crates/myco-models",
    "crates/myco-config",
    "crates/myco-session",
    "crates/myco-machines",
    "crates/myco-agent",
    "crates/myco-test-support",
    "crates/myco-api",
    "crates/myco-auth",
    "crates/myco-gui",
]

[workspace.package]
version = "0.4.0-dev"
edition = "2024"
license = "MIT"
repository = "https://github.com/tsnl/myco"

[workspace.dependencies]
myco-core = { path = "crates/myco-core", version = "0.4.0-dev" }
myco-prompts = { path = "crates/myco-prompts", version = "0.4.0-dev" }
myco-models = { path = "crates/myco-models", version = "0.4.0-dev" }
myco-config = { path = "crates/myco-config", version = "0.4.0-dev" }
myco-session = { path = "crates/myco-session", version = "0.4.0-dev" }
myco-machines = { path = "crates/myco-machines", version = "0.4.0-dev" }
myco-agent = { path = "crates/myco-agent", version = "0.4.0-dev" }
myco-test-support = { path = "crates/myco-test-support", version = "0.4.0-dev" }
myco-api = { path = "crates/myco-api", version = "0.4.0-dev" }
myco-auth = { path = "crates/myco-auth", version = "0.4.0-dev" }

async-trait = "0.1"
atomic-write-file = "0.3.0"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6.2", features = ["derive"] }
dirs = "6"
dotenvy = "0.15.7"
futures = "0.3.32"
infer = { version = "0.22.0", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "charset", "http2", "system-proxy", "rustls-tls"] }
rocket = { version = "0.5", features = ["json"] }
schemars = "1.2.1"
serde = { version = "1.0.228", features = ["serde_derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["full"] }
tokio-util = { version = "0.7", default-features = false }
toml = "0.8"
url = "2"
uuid = { version = "1.23.2", features = ["v4", "serde"] }
