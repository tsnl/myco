[workspace]
members = ["crates/myco-model", "crates/myco-agent"]
default-members = [".", "crates/myco-model", "crates/myco-agent"]
resolver = "3"

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/tsnl/myco"

[workspace.dependencies]
myco-agent = { path = "crates/myco-agent", version = "=0.3.0" }
myco-model = { path = "crates/myco-model", version = "=0.3.0" }
futures = "0.3.32"
schemars = "1.2.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
tokio = "1.52.3"
uuid = { version = "1.23.2", features = ["v4", "serde"] }

[package]
name = "myco"
version.workspace = true
edition.workspace = true
description = "Multi-host coding agent CLI (local in-process + SSH remotes)"
repository.workspace = true
homepage = "https://github.com/tsnl/myco"
readme = "README.md"
keywords = ["agent", "cli", "ssh", "coding"]
categories = ["command-line-utilities", "development-tools"]
license.workspace = true

[dependencies]
myco-model.workspace = true
myco-agent.workspace = true
atomic-write-file = "0.3.0"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6.2", features = ["derive"] }
dirs = "6"
dotenvy = "0.15.7"
futures.workspace = true
libc = "0.2"
rustyline = "15"
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml = "0.8"
tokio = { workspace = true, features = ["full"] }
url = "2"
uuid.workspace = true
unicode-width = "0.2"
# Magic-number sniffing so an image's media type comes from its bytes, not its
# filename. `std` would pull `cfb` (MS Office compound files) for detection we
# never use; the byte-slice matchers we need are available without it.
infer = { version = "0.22.0", default-features = false }

[target.'cfg(unix)'.dependencies]
# Terminal width detection (TIOCGWINSZ) for `--wrap auto`.
libc = "0.2"
