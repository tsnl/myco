[package]
name = "myco"
description = "Multi-host coding agent: API server driving concurrent agents across SSH remotes"
version.workspace = true
edition.workspace = true
license.workspace = true
repository = "https://github.com/tsnl/myco"
homepage = "https://github.com/tsnl/myco"
readme = "README.md"
keywords = ["agent", "server", "ssh", "coding"]
categories = ["development-tools"]

[dependencies]
uuid = { workspace = true }
async-trait = { workspace = true }
myco-api = { workspace = true }
myco-types = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
rocket = { workspace = true }
clap = { workspace = true }
dotenvy = { workspace = true }
schemars = { workspace = true }
reqwest = { workspace = true }
libc = "0.2.189"
atomic-write-file = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
dirs = { workspace = true }
hmac = "0.12"
infer = { workspace = true }
rand = "0.9"
sha2 = "0.10"
thiserror = { workspace = true }
tokio-util = { workspace = true }
toml = { workspace = true }
url = { workspace = true }
vt100 = "0.15"
rocket_ws = "0.1.1"
webauthn-rs = "0.5.5"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
myco = { path = ".", features = ["test-support"] }
tempfile = "3"
url.workspace = true
uuid.workspace = true
webauthn-authenticator-rs = { version = "0.5.5", features = ["softtoken"] }

[features]
# Test fixtures (ScriptedModel, temp_home, entry builders) for integration
# tests; enabled via the self dev-dependency, so one lib build serves both.
test-support = []

[workspace]
resolver = "3"
members = [
    "crates/myco-types",
    "crates/myco-api",
    "crates/myco-gui",
]

[workspace.package]
version = "0.4.0-dev"
edition = "2024"
license = "MIT"
repository = "https://github.com/tsnl/myco"

[workspace.dependencies]
myco-api = { path = "crates/myco-api", version = "0.4.0-dev" }
myco-types = { path = "crates/myco-types", version = "0.4.0-dev" }

async-trait = "0.1"
atomic-write-file = "0.3.0"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6.2", features = ["derive"] }
dirs = "6"
dotenvy = "0.15.7"
futures = "0.3.32"
infer = { version = "0.22.0", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "charset", "http2", "system-proxy", "rustls-tls"] }
rocket = { version = "0.5", features = ["json"] }
schemars = "1.2.1"
serde = { version = "1.0.228", features = ["serde_derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["full"] }
tokio-util = { version = "0.7", default-features = false }
toml = "0.8"
url = "2"
uuid = { version = "1.23.2", features = ["v4", "serde", "v5"] }
