[workspace]
resolver = "3"
members = ["crates/runtime", "crates/instance", "crates/kind-tty"]

[workspace.package]
edition = "2024"
license = "MIT"

[workspace.dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
vt100 = "0.15"
