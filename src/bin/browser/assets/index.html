<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
  <title>myco</title>
  <link rel="icon" href="/favicon.ico" sizes="16x16 32x32">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" sizes="any">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/sky.css">
  <script src="/profiles.js" type="module"></script>
  <script src="/sky.js" type="module"></script>
  <script src="/app.js" type="module"></script>
</head>
<body>
  <header class="toolbar">
    <div class="toolbar-inner">
      <div class="toolbar-heading">
        <a class="brand" href="/" aria-label="myco home">myco<span aria-hidden="true">_</span></a>
        <select id="profile-switcher" aria-label="Profile"><option>__MYCO_PROFILE__</option></select>
        <h1 id="session-title">Session</h1>
      </div>
      <span id="connection" class="activity-indicator" role="status" data-state="attention">Connecting…</span>
      <div class="toolbar-actions" role="group" aria-label="Session controls">
        <div class="toolbar-tools">
          <button id="compact" type="button">Compact</button>
          <button id="activity-toggle" type="button" aria-haspopup="dialog" aria-controls="activity" aria-expanded="false">Activity <span id="activity-count" hidden>0</span></button>
          <button id="archive" type="button" disabled>Archive</button>
        </div>
        <a id="new-session" class="button" href="/new" target="_blank" rel="noopener" aria-label="New session (opens in a new tab)" title="New session (opens in a new tab)"><span aria-hidden="true">+</span> New</a>
      </div>
    </div>
  </header>
  <main id="transcript" aria-label="Conversation" aria-busy="false">
    <section class="welcome"><h1>MYCO</h1><p>Write a prompt to begin.<br>Tool inputs and output expand in place.</p></section>
  </main>
  <button id="jump" type="button" hidden>↓ Latest output</button>
  <dialog id="activity" aria-labelledby="activity-title">
    <header class="activity-heading"><h2 id="activity-title">Activity</h2><button id="activity-close" type="button" aria-label="Close activity" autofocus>×</button></header>
    <p id="activity-empty">No running activities.</p>
    <section id="active-calls" class="activity-section" hidden>
      <h3>Tool calls</h3><ul id="activity-list"></ul>
    </section>
  </dialog>
  <div id="composer-frame" class="composer-frame" data-state="reconnecting">
    <div class="composer-light" aria-hidden="true"></div>
    <form id="composer" class="composer">
      <section id="queued" hidden aria-label="Queued messages"><span id="queued-count" role="status"></span><ol id="queued-list"></ol></section>
      <div id="queue-edit" hidden><span id="queue-edit-label" role="status"></span><button id="queue-edit-cancel" type="button">Discard edits</button></div>
      <div class="composer-heading"><label for="prompt">USER</label><div class="composer-options"><button id="attach" type="button" title="Attach images, or paste an image into your message" aria-label="Attach images"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 13 7-7a3 3 0 0 1 4 4L9 20a5 5 0 0 1-7-7L13 2a7 7 0 0 1 10 10L12 23" transform="translate(1 -1) scale(.9)"/></svg><span>Attach</span></button><select id="model" aria-label="Model" disabled></select></div></div>
      <input id="attachment-picker" type="file" accept="image/png,image/jpeg,image/gif,image/webp,.png,.jpg,.jpeg,.gif,.webp" multiple hidden>
      <section id="attachments" aria-label="Image attachments" hidden><div id="attachment-count" role="status"></div><ul id="attachment-list"></ul></section>
      <textarea id="prompt" rows="2" autofocus aria-describedby="input-hint connection" spellcheck="false"></textarea>
      <div class="composer-footer"><span id="input-hint">Enter to send · Shift+Enter for a new line</span><button id="cancel" type="button" hidden>Cancel run</button><button id="send" type="submit" disabled>Send ↵</button></div>
      <div id="token-usage" role="group" aria-label="Token usage">
        <span id="context-usage">Context — / —</span>
        <div class="usage-counts"><span id="input-tokens">Input —</span><span id="output-tokens">Output —</span><span id="cached-tokens">Cached —</span></div>
      </div>
      <div id="error" role="alert" hidden></div>
    </form>
  </div>
</body>
</html>
