<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>New session · myco</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/sky.css">
  <script src="/profiles.js" type="module"></script>
  <script src="/sky.js" type="module"></script>
  <script src="/new.js" type="module"></script>
</head>
<body>
  <header class="toolbar"><div class="toolbar-inner">
    <a class="brand" href="/" aria-label="myco home">myco<span aria-hidden="true">_</span></a>
        <select id="profile-switcher" aria-label="Profile"><option>__MYCO_PROFILE__</option></select>
    <div class="toolbar-actions"><div class="toolbar-tools"></div></div>
  </div></header>
  <main id="session-browser">
    <section class="welcome">
      <h1>New session</h1>
      <p id="creation-status" role="status">Creating your session…</p>
      <p id="error" role="alert" hidden></p>
      <button id="retry" type="button" hidden>Try again</button>
    </section>
  </main>
</body>
</html>
