<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sessions · myco</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/sky.css">
  <script src="/profiles.js" type="module"></script>
  <script src="/sky.js" type="module"></script>
  <script src="/home.js" type="module"></script>
</head>
<body>
  <header class="toolbar">
    <div class="toolbar-inner">
      <div class="toolbar-heading">
        <a class="brand" href="/" aria-label="myco home">myco<span aria-hidden="true">_</span></a>
        <select id="profile-switcher" aria-label="Profile"><option>__MYCO_PROFILE__</option></select>
        <h1 id="session-title">Sessions</h1>
      </div>
      <span id="connection" class="activity-indicator" role="status" data-state="attention">Connecting…</span>
      <div class="toolbar-actions" role="group" aria-label="Session controls">
        <div class="toolbar-tools"></div>
        <a id="new-session" class="button" href="/new" target="_blank" rel="noopener" aria-label="New session (opens in a new tab)" title="New session (opens in a new tab)"><span aria-hidden="true">+</span> New</a>
      </div>
    </div>
  </header>
  <main id="session-browser">
    <label for="search">Find a session</label>
    <input id="search" type="search" placeholder="Search by title, model, or session ID" autocomplete="off">
    <select id="archive-filter" aria-label="Session visibility">
      <option value="active">Active sessions</option>
      <option value="archived">Archived sessions</option>
    </select>
    <p id="session-count" role="status">Loading sessions…</p>
    <p id="error" role="alert" hidden></p>
    <ul id="session-list" aria-label="Sessions"></ul>
  </main>
</body>
</html>
