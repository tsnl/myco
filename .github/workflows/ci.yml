name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# Required checks for branch protection and the release CI gate:
#   Check Formatting, Lint, Test  (job names; see publish.yml)
jobs:
  fmt:
    name: Check Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: cargo fmt
        run: cargo fmt --all -- --check

  clippy:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo clippy
        # All workspace libraries, binaries, and tests.
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check standalone library features
        run: |
          cargo check --locked -p myco-model --lib
          cargo check --locked -p myco-agent --lib
      - name: Release version and CI gate tests
        run: python3 -m unittest discover -s scripts -p '*_test.py'
      - name: GEPA adapter tests (no model calls)
        run: |
          python3 -m venv "$RUNNER_TEMP/gepa"
          "$RUNNER_TEMP/gepa/bin/pip" install -r evals/gepa/requirements.txt
          "$RUNNER_TEMP/gepa/bin/python" -m unittest discover -s evals/gepa -p 'test_*.py'
      - name: cargo test (offline)
        # Full suite, no live provider calls. Live Anthropic/xAI tests are
        # #[ignore] — run locally with: cargo test -- --ignored
        run: cargo test --locked --workspace
      - name: Browser regression tests (local scripted model)
        run: |
          cargo build --locked --bin myco
          for asset in src/bin/browser/assets/*.js; do node --input-type=module --check < "$asset"; done
          python3 -m venv "$RUNNER_TEMP/browser"
          "$RUNNER_TEMP/browser/bin/pip" install -r scripts/browser-requirements.txt
          "$RUNNER_TEMP/browser/bin/python" -m playwright install --with-deps chromium
          "$RUNNER_TEMP/browser/bin/python" scripts/browser_tests.py
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: target/browser-test-results
          if-no-files-found: ignore
