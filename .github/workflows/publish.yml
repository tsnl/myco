name: Publish

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to publish from (main for a real release)"
        required: true
        default: "main"
        type: string
      bump_type:
        description: "Version bump type"
        required: true
        default: "patch"
        type: choice
        options: [patch, minor, major]
      dry_run:
        description: "Verify packages without committing, pushing, or uploading"
        required: false
        default: true
        type: boolean
      release_notes:
        description: "Markdown prepended to the GitHub Release body (optional)"
        required: false
        default: ""
        type: string
  # A request commit also supports environments without workflow-dispatch access.
  push:
    branches: ["claude/**"]
    paths: [".github/publish-request.json"]

permissions:
  contents: write
  checks: read

concurrency:
  group: publish-workspace
  cancel-in-progress: false

jobs:
  publish:
    name: Publish Workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Resolve publish parameters
        id: params
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_BRANCH: ${{ github.event.inputs.branch }}
          DISPATCH_BUMP: ${{ github.event.inputs.bump_type }}
          DISPATCH_DRY_RUN: ${{ github.event.inputs.dry_run }}
          DISPATCH_NOTES: ${{ github.event.inputs.release_notes }}
        run: |
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            branch="$DISPATCH_BRANCH"
            bump_type="$DISPATCH_BUMP"
            dry_run="$DISPATCH_DRY_RUN"
            printf '%s\n' "$DISPATCH_NOTES" > "$RUNNER_TEMP/notes.md"
          else
            request=.github/publish-request.json
            branch="$(jq -er .branch "$request")"
            bump_type="$(jq -er .bump_type "$request")"
            dry_run="$(jq -r .dry_run "$request")"
            notes_path="$(jq -er .notes_path "$request")"
            cp -- "$notes_path" "$RUNNER_TEMP/notes.md"
          fi
          git check-ref-format "refs/heads/$branch"
          case "$bump_type" in patch|minor|major) ;; *) exit 1 ;; esac
          case "$dry_run" in true|false) ;; *) exit 1 ;; esac
          if [ "$dry_run" = false ] && [ "$branch" != main ]; then
            echo '::error::Real releases must target main'; exit 1
          fi
          {
            echo "branch=$branch"
            echo "bump_type=$bump_type"
            echo "dry_run=$dry_run"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        with:
          ref: refs/heads/${{ steps.params.outputs.branch }}
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Require successful CI on the release source
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: python3 scripts/release.py check-ci

      - name: Bump workspace version and internal dependency pins
        id: version
        env:
          BUMP_TYPE: ${{ steps.params.outputs.bump_type }}
        run: python3 scripts/release.py prepare "$BUMP_TYPE"

      - name: Verify every package from its archive
        run: cargo publish --workspace --dry-run --locked --allow-dirty

      - name: Commit and tag the verified workspace
        if: steps.params.outputs.dry_run == 'false'
        env:
          RELEASE_BRANCH: ${{ steps.params.outputs.branch }}
          RELEASE_TAG: ${{ steps.version.outputs.tag_name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.toml Cargo.lock
          git commit -m "Release $RELEASE_TAG"
          git tag "$RELEASE_TAG"
          git push --atomic origin "HEAD:refs/heads/$RELEASE_BRANCH" "refs/tags/$RELEASE_TAG"

      - name: Publish workspace in dependency order
        if: steps.params.outputs.dry_run == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --workspace --locked

      - name: Assemble release body
        if: steps.params.outputs.dry_run == 'false'
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.new_version }}
          RELEASE_TAG: ${{ steps.version.outputs.tag_name }}
        run: |
          cp "$RUNNER_TEMP/notes.md" "$RUNNER_TEMP/release-body.md"
          {
            printf '\n---\n\nPublished myco-model, myco-agent, and myco %s.\n\n' "$RELEASE_VERSION"
            printf 'Install:\n```bash\ncargo install myco --locked\n'
            printf 'cargo install --git https://github.com/%s --tag %s --locked\n```\n' "$GITHUB_REPOSITORY" "$RELEASE_TAG"
            printf '\nBuild on the target host; see `myco --help harness-ops`.\n'
          } >> "$RUNNER_TEMP/release-body.md"

      - name: Create GitHub Release
        if: steps.params.outputs.dry_run == 'false'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: ${{ steps.version.outputs.new_version }}
          generate_release_notes: true
          body_path: ${{ runner.temp }}/release-body.md

      - name: Summary
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.new_version }}
          DRY_RUN: ${{ steps.params.outputs.dry_run }}
        run: |
          {
            echo '## Workspace release'
            echo "- Version: $RELEASE_VERSION"
            echo '- Packages: myco-model, myco-agent, myco'
            echo "- Dry run: $DRY_RUN"
          } >> "$GITHUB_STEP_SUMMARY"
